    <!-- Safe polyfill for browser extensions attempting to assign window.fetch -->
    <script>
      (function() {
        try {
          var realFetch = window.fetch;
          var currentFetch = realFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return currentFetch;
            },
            set: function(newFetch) {
              currentFetch = newFetch;
            }
          });
        } catch (e) {
          // ignore error if property is strictly sealed
        }

        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('fetch') !== -1 && event.message.indexOf('getter') !== -1) {
            event.preventDefault();
            event.stopPropagation();
            return true;
          }
        }, true);
      })();
    </script>
